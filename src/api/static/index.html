<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnMate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { brand: '#6366f1' }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html { scroll-behavior: smooth; }
    .prose p { margin-bottom: 0.75rem; }
    .prose p:last-child { margin-bottom: 0; }
    .prose strong { font-weight: 600; }
    #chat-messages { scroll-behavior: smooth; }
    .typing-cursor::after {
      content: '▋';
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .fade-in { animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="dark bg-gray-950 text-gray-100 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white font-bold text-sm">L</div>
      <span class="font-semibold text-gray-100">LearnMate</span>
    </div>
    <!-- Mode tabs -->
    <div class="flex gap-1 bg-gray-900 rounded-lg p-1">
      <button id="tab-teach" onclick="switchMode('teach')"
        class="px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-indigo-500 text-white">
        Teach
      </button>
      <button id="tab-test" onclick="switchMode('test')"
        class="px-4 py-1.5 rounded-md text-sm font-medium transition-all text-gray-400 hover:text-gray-200">
        Test
      </button>
    </div>
    <!-- Reset button -->
    <button onclick="resetSession()" title="Yeni oturum"
      class="text-gray-500 hover:text-gray-300 transition-colors text-sm flex items-center gap-1.5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Sıfırla
    </button>
  </header>

  <!-- TEACH MODE -->
  <div id="teach-panel" class="flex flex-col flex-1 min-h-0">
    <!-- Messages -->
    <div id="chat-messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-6">
      <div class="flex justify-center">
        <p class="text-gray-500 text-sm">Wiki'nden öğren. Bir şey sor.</p>
      </div>
    </div>

    <!-- Sources bar -->
    <div id="sources-bar" class="hidden px-6 py-2 border-t border-gray-800 bg-gray-900/50">
      <p class="text-xs text-gray-500">
        <span class="text-gray-400 font-medium">Kaynaklar:</span>
        <span id="sources-text"></span>
      </p>
    </div>

    <!-- Input -->
    <div class="border-t border-gray-800 px-4 py-4 shrink-0">
      <form id="teach-form" onsubmit="sendQuestion(event)" class="flex gap-3 max-w-3xl mx-auto">
        <input id="teach-input" type="text" placeholder="Soru sor..."
          class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm
                 text-gray-100 placeholder-gray-500 outline-none
                 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all" />
        <button type="submit" id="send-btn"
          class="bg-indigo-500 hover:bg-indigo-400 disabled:opacity-40 disabled:cursor-not-allowed
                 px-5 py-3 rounded-xl text-sm font-medium transition-all">
          Gönder
        </button>
      </form>
    </div>
  </div>

  <!-- TEST MODE -->
  <div id="test-panel" class="hidden flex-1 overflow-y-auto px-4 py-8">
    <div class="max-w-2xl mx-auto space-y-6">

      <!-- Topic input (initial) -->
      <div id="test-start" class="space-y-4">
        <p class="text-gray-400 text-sm text-center">Konu gir veya boş bırak (rastgele).</p>
        <div class="flex gap-3">
          <input id="topic-input" type="text" placeholder="Konu (opsiyonel)..."
            class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm
                   text-gray-100 placeholder-gray-500 outline-none
                   focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all" />
          <button onclick="startTest()"
            class="bg-indigo-500 hover:bg-indigo-400 px-5 py-3 rounded-xl text-sm font-medium transition-all">
            Başla
          </button>
        </div>
      </div>

      <!-- Question card -->
      <div id="question-card" class="hidden fade-in space-y-5">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-3">
          <div class="flex items-center gap-2">
            <span class="text-xs font-medium text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded-full">Soru</span>
            <span id="q-sources" class="text-xs text-gray-500"></span>
          </div>
          <p id="question-text" class="text-gray-100 leading-relaxed"></p>
        </div>

        <!-- Answer input -->
        <div id="answer-section" class="space-y-3">
          <textarea id="answer-input" rows="4" placeholder="Cevabını yaz..."
            class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm
                   text-gray-100 placeholder-gray-500 outline-none resize-none
                   focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"></textarea>
          <div class="flex gap-2">
            <button onclick="submitAnswer()"
              class="bg-indigo-500 hover:bg-indigo-400 px-5 py-2.5 rounded-xl text-sm font-medium transition-all">
              Değerlendir
            </button>
            <button onclick="skipQuestion()"
              class="bg-gray-800 hover:bg-gray-700 px-5 py-2.5 rounded-xl text-sm font-medium transition-all text-gray-300">
              Atla
            </button>
          </div>
        </div>

        <!-- Evaluation result -->
        <div id="eval-card" class="hidden fade-in bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4">
          <div class="flex items-center gap-2">
            <span id="score-badge" class="text-xs font-medium px-2.5 py-0.5 rounded-full"></span>
          </div>
          <div id="eval-text" class="text-gray-300 text-sm leading-relaxed whitespace-pre-wrap"></div>
          <div class="flex gap-2 pt-2">
            <button onclick="nextQuestion()"
              class="bg-indigo-500 hover:bg-indigo-400 px-5 py-2.5 rounded-xl text-sm font-medium transition-all">
              Sonraki Soru
            </button>
            <button onclick="showSummary()"
              class="bg-gray-800 hover:bg-gray-700 px-5 py-2.5 rounded-xl text-sm font-medium transition-all text-gray-300">
              Özet
            </button>
          </div>
        </div>
      </div>

      <!-- Summary card -->
      <div id="summary-card" class="hidden fade-in bg-gray-900 border border-gray-800 rounded-2xl p-6">
        <h3 class="text-sm font-semibold text-gray-300 mb-3">Oturum Özeti</h3>
        <pre id="summary-text" class="text-sm text-gray-400 whitespace-pre-wrap font-mono"></pre>
        <button onclick="resetSession()" class="mt-4 bg-indigo-500 hover:bg-indigo-400 px-5 py-2.5 rounded-xl text-sm font-medium transition-all">
          Yeni Oturum
        </button>
      </div>

      <!-- Loading -->
      <div id="test-loading" class="hidden text-center py-8">
        <div class="inline-flex items-center gap-2 text-gray-500 text-sm">
          <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
          Yükleniyor...
        </div>
      </div>

    </div>
  </div>

<script>
  let currentMode = 'teach';
  let isStreaming = false;

  // ── Mode switching ──────────────────────────────────────────────
  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('teach-panel').classList.toggle('hidden', mode !== 'teach');
    document.getElementById('teach-panel').classList.toggle('flex', mode === 'teach');
    document.getElementById('test-panel').classList.toggle('hidden', mode !== 'test');

    const activeClass = ['bg-indigo-500', 'text-white'];
    const inactiveClass = ['text-gray-400', 'hover:text-gray-200'];

    ['teach', 'test'].forEach(m => {
      const tab = document.getElementById(`tab-${m}`);
      if (m === mode) {
        tab.classList.add(...activeClass);
        tab.classList.remove(...inactiveClass);
      } else {
        tab.classList.remove(...activeClass);
        tab.classList.add(...inactiveClass);
      }
    });
  }

  function resetSession() {
    const endpoint = currentMode === 'teach' ? '/teach/reset' : '/test/reset';
    fetch(endpoint, { method: 'POST' });

    if (currentMode === 'teach') {
      document.getElementById('chat-messages').innerHTML =
        '<div class="flex justify-center"><p class="text-gray-500 text-sm">Wiki\'nden öğren. Bir şey sor.</p></div>';
      document.getElementById('sources-bar').classList.add('hidden');
    } else {
      document.getElementById('test-start').classList.remove('hidden');
      document.getElementById('question-card').classList.add('hidden');
      document.getElementById('summary-card').classList.add('hidden');
      document.getElementById('topic-input').value = '';
    }
  }

  // ── Teach mode ──────────────────────────────────────────────────
  function appendMessage(role, content, isStreaming = false) {
    const container = document.getElementById('chat-messages');
    const isUser = role === 'user';

    const wrap = document.createElement('div');
    wrap.className = `flex ${isUser ? 'justify-end' : 'justify-start'} fade-in`;

    const bubble = document.createElement('div');
    bubble.className = isUser
      ? 'max-w-xl bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 text-sm leading-relaxed'
      : 'max-w-2xl bg-gray-900 border border-gray-800 text-gray-200 rounded-2xl rounded-tl-sm px-4 py-3 text-sm leading-relaxed prose';

    if (isStreaming) bubble.classList.add('typing-cursor');
    bubble.id = isStreaming ? 'streaming-bubble' : '';
    bubble.textContent = content;

    wrap.appendChild(bubble);
    container.appendChild(wrap);
    container.scrollTop = container.scrollHeight;
    return bubble;
  }

  async function sendQuestion(e) {
    e.preventDefault();
    if (isStreaming) return;

    const input = document.getElementById('teach-input');
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    isStreaming = true;
    document.getElementById('send-btn').disabled = true;
    document.getElementById('sources-bar').classList.add('hidden');

    appendMessage('user', question);
    const bubble = appendMessage('assistant', '', true);

    const res = await fetch('/teach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));

        if (data.type === 'sources' && data.sources.length > 0) {
          document.getElementById('sources-text').textContent = ' ' + data.sources.join(', ');
          document.getElementById('sources-bar').classList.remove('hidden');
        } else if (data.type === 'token') {
          fullText += data.token;
          bubble.textContent = fullText;
          document.getElementById('chat-messages').scrollTop =
            document.getElementById('chat-messages').scrollHeight;
        } else if (data.type === 'done') {
          bubble.classList.remove('typing-cursor');
          bubble.id = '';
        }
      }
    }

    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  // ── Test mode ───────────────────────────────────────────────────
  async function startTest() {
    const topic = document.getElementById('topic-input').value.trim();
    document.getElementById('test-start').classList.add('hidden');
    await loadQuestion(topic);
  }

  async function loadQuestion(topic = '') {
    setTestLoading(true);
    document.getElementById('question-card').classList.add('hidden');
    document.getElementById('eval-card').classList.add('hidden');

    const res = await fetch('/test/question', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic })
    });
    const data = await res.json();

    document.getElementById('question-text').textContent = data.question;
    document.getElementById('q-sources').textContent = data.sources.join(', ');
    document.getElementById('answer-input').value = '';
    document.getElementById('answer-section').classList.remove('hidden');
    document.getElementById('eval-card').classList.add('hidden');

    setTestLoading(false);
    document.getElementById('question-card').classList.remove('hidden');
    document.getElementById('answer-input').focus();
  }

  async function submitAnswer() {
    const answer = document.getElementById('answer-input').value.trim();
    if (!answer) return;

    setTestLoading(true);
    document.getElementById('answer-section').classList.add('hidden');

    const res = await fetch('/test/evaluate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answer })
    });
    const data = await res.json();

    const score = data.score || 'unknown';
    const badge = document.getElementById('score-badge');
    const scoreMap = {
      dogru:   { text: 'Doğru ✓',  cls: 'bg-green-500/15 text-green-400' },
      kismi:   { text: 'Kısmi ~',  cls: 'bg-yellow-500/15 text-yellow-400' },
      yanlis:  { text: 'Yanlış ✗', cls: 'bg-red-500/15 text-red-400' },
    };
    const s = scoreMap[score] || { text: score, cls: 'bg-gray-500/15 text-gray-400' };
    badge.textContent = s.text;
    badge.className = `text-xs font-medium px-2.5 py-0.5 rounded-full ${s.cls}`;

    document.getElementById('eval-text').textContent = data.evaluation_text;

    setTestLoading(false);
    document.getElementById('eval-card').classList.remove('hidden');
  }

  async function skipQuestion() {
    await loadQuestion();
  }

  async function nextQuestion() {
    await loadQuestion();
  }

  async function showSummary() {
    const res = await fetch('/test/summary');
    const data = await res.json();
    document.getElementById('summary-text').textContent = data.summary;
    document.getElementById('question-card').classList.add('hidden');
    document.getElementById('summary-card').classList.remove('hidden');
  }

  function setTestLoading(show) {
    document.getElementById('test-loading').classList.toggle('hidden', !show);
  }

  // Enter key in teach input
  document.getElementById('teach-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('teach-form').requestSubmit();
    }
  });
</script>
</body>
</html>
